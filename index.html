<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>China Trip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F1;--surface:#fff;--ink:#18211E;--muted:#5D6B66;--line:#D9DFDB;--accent:#2F6F61;--bad:#B4432E}
@media (prefers-color-scheme:dark){:root{--bg:#111715;--surface:#19211E;--ink:#E7ECE9;--muted:#9AA8A2;--line:#2B3632;--accent:#6CC2AC;--bad:#E0745D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:400 2.2rem/1 "Instrument Serif",Georgia,serif}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
button{font:600 .95rem inherit;font-family:inherit;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>China Trip</h1>
  <p>This page is private. Enter the password to open it.</p>
  <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required autofocus></div>
  <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="font-weight:400">Remember on this device</label></div>
  <button type="submit" id="go">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>

const ITER=150000;
const KEY="china-trip-pw";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function unlock(pw){
  const raw=b64(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
  return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close()}
async function attempt(pw,remember){
  try{const html=await unlock(pw);
    try{remember?localStorage.setItem(KEY,pw):localStorage.removeItem(KEY)}catch(e){}
    show(html);return true}
  catch(e){return false}
}
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved&&await attempt(saved,true))return;
  try{localStorage.removeItem(KEY)}catch(e){}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="Opening…";err.textContent="";
  const ok=await attempt(document.getElementById("pw").value,document.getElementById("keep").checked);
  if(!ok){btn.disabled=false;btn.textContent="Open";err.textContent="That password didn't work. Try again.";document.getElementById("pw").select()}
});
</script>
